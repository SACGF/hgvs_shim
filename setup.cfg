[metadata]
name = hgvs_shim
version = attr: hgvs_shim.__version__
author = Dave Lawrence
author_email = davmlaw@gmail.com
description = Abstract PyHGVS and Biocommons HGVS libraries
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/SACGF/hgvs_shim
project_urls =
    Bug Tracker = https://github.com/SACGF/hgvs_shim/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
packages = find:
python_requires = >=3.10
install_requires =
	hgvs
	pyhgvs

[options.packages.find]
where =
exclude=
    tests

